<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Roadmap 2026</title>
    <link rel="shortcut icon" href="icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #0f172a, #020617);
        color: white;
        padding: 40px;
      }

      h1 {
        text-align: center;
        margin-bottom: 50px;
        font-size: 40px;
        letter-spacing: 1px;
      }

      .phase {
        margin-bottom: 40px;
        background: #020617;
        padding: 25px;
        border-radius: 12px;
        border: 1px solid #1e293b;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      .phase h2 {
        background: #1e293b;
        padding: 12px;
        border-radius: 8px;
        font-size: 22px;
        letter-spacing: 0.5px;
      }

      .topic {
        margin-top: 20px;
      }

      .topic h3 {
        color: #38bdf8;
        margin-bottom: 8px;
        font-size: 20px;
        font-weight: 500;
      }

      ul {
        list-style: none;
        padding: 0;
      }

      li {
        background: #0f172a;
        margin: 6px 0;
        padding: 10px 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.25s ease;
        border: 1px solid transparent;
        font-size: 16px;
      }

      li:hover {
        background: #1e293b;
        border: 1px solid #38bdf8;
        transform: translateX(4px);
      }

      .done {
        background: #16a34a;
        text-decoration: line-through;
        border: none;
      }
      
p {
  max-width: 900px;
  margin: -20px auto 40px;
  padding: 18px 24px;
  text-align: center;
  font-size: 17px;
  line-height: 1.8;
  color: #cbd5e1;
  background: #0f172a;
  border: 1px solid #1e293b;
  border-radius: 12px;
}
    </style>
  </head>

  <body>
    <h1>Master GSAP Roadmap for React, Next.js & Frontend Jobs</h1>
    <p>Phase 1 → 4 pe sabse zyada focus karo (ye interviews aur real projects dono ke liye sabse important hain). Phase 5–7 tumhari animations ko premium look denge. ye road map acha he toh iski ek websitte bana de aisi</p>
    <div id="roadmap"></div>

    <script>
      let roadmap = {
  "PHASE 1 — GSAP BASICS": {
    Methods: [
      "gsap.to()",
      "gsap.from()",
      "gsap.fromTo()",
      "gsap.set()",
    ],

    Properties: [
      "x",
      "y",
      "xPercent",
      "yPercent",
      "opacity / autoAlpha",
      "scale",
      "rotation",
      "rotationX",
      "rotationY",
      "skewX",
      "skewY",
    ],

    "Timing & Control": [
      "duration",
      "delay",
      "ease",
      "stagger",
      "repeat",
      "repeatDelay",
      "yoyo",
    ],
  },

  "PHASE 2 — TIMELINE": {
    Learn: [
      "gsap.timeline()",
      "Chaining",
      "Position Parameters (<, >, -=0.5, +=0.5)",
      "Labels",
    ],

    Controls: [
      "play()",
      "pause()",
      "resume()",
      "reverse()",
      "restart()",
    ],
  },

  "PHASE 3 — SCROLLTRIGGER": {
    Setup: ["Register Plugin"],

    Options: [
      "trigger",
      "start",
      "end",
      "scrub",
      "pin",
      "toggleActions",
      "markers",
    ],

    Methods: ["refresh()", "kill()"],
  },

  "PHASE 4 — REACT INTEGRATION": {
    React: [
      "useGSAP()",
      "useRef()",
      "Scope",
      "Cleanup",
    ],
  },

  "PHASE 5 — TEXT ANIMATION": {
    Text: [
      "Character Animation",
      "Word Animation",
      "Line Animation",
      "SplitType / SplitText",
    ],
  },

  "PHASE 6 — REAL WORLD ANIMATIONS": {
    Projects: [
      "Hero Animation",
      "Navbar Animation",
      "Section Reveal",
      "Cards Stagger",
      "Button Hover",
      "Image Reveal",
      "Image Zoom",
      "Fade",
      "Slide",
      "Scale",
      "Rotate",
      "Parallax",
      "Counter Animation",
      "Loader",
      "Page Intro",
    ],
  },

  "PHASE 7 — EASES": {
    Eases: [
      "none",
      "power1",
      "power2",
      "power3",
      "power4",
      "back",
      "expo",
      "circ",
      "elastic",
    ],
  },
};
      let saved = JSON.parse(localStorage.getItem("roadmapProgress")) || {};

      let container = document.getElementById("roadmap");

      for (let phase in roadmap) {
        let phaseDiv = document.createElement("div");
        phaseDiv.className = "phase";

        let h2 = document.createElement("h2");
        h2.innerText = phase;

        phaseDiv.appendChild(h2);

        for (let topic in roadmap[phase]) {
          let topicDiv = document.createElement("div");
          topicDiv.className = "topic";

          let h3 = document.createElement("h3");
          h3.innerText = topic;

          let ul = document.createElement("ul");

          roadmap[phase][topic].forEach((task) => {
            let li = document.createElement("li");
            li.innerText = task;

            if (saved[task]) {
              li.classList.add("done");
            }

            li.onclick = function () {
              saved[task] = !saved[task];

              localStorage.setItem("roadmapProgress", JSON.stringify(saved));

              li.classList.toggle("done");
            };

            ul.appendChild(li);
          });

          topicDiv.appendChild(h3);
          topicDiv.appendChild(ul);

          phaseDiv.appendChild(topicDiv);
        }

        container.appendChild(phaseDiv);
      }
    </script>
  </body>
  <!-- "Projects": ["To-do App", "API Fetcher", "Calculator", "Mini Games", "Form Validation"] -->
</html>
