<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full Stack Roadmap 2026</title>
  <link rel="shortcut icon" href="icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: white;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 50px;
      font-size: 40px;
      letter-spacing: 1px;
    }

    .phase {
      margin-bottom: 40px;
      background: #020617;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .phase h2 {
      background: #1e293b;
      padding: 12px;
      border-radius: 8px;
      font-size: 22px;
      letter-spacing: 0.5px;
    }

    .topic {
      margin-top: 20px;
    }

    .topic h3 {
      color: #38bdf8;
      margin-bottom: 8px;
      font-size: 20px;
      font-weight: 500;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #0f172a;
      margin: 6px 0;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.25s ease;
      border: 1px solid transparent;
      font-size: 16px;
    }

    li:hover {
      background: #1e293b;
      border: 1px solid #38bdf8;
      transform: translateX(4px);
    }

    .done {
      background: #16a34a;
      text-decoration: line-through;
      border: none;
    }
  </style>
</head>

<body>
  <h1>Full Stack Developer Roadmap (2026)</h1>

  <div id="roadmap"></div>

  <script>
    let roadmap = {
      "PHASE 1 — FRONTEND DEVELOPMENT": {
        HTML5: [
          "Semantic HTML",
          "Forms & Inputs",
          "SEO Basics",
          "Links & Images",
          "Lists & Tables",
        ],

        CSS: [
          "Box Model",
          "Flexbox",
          "Grid",
          "Responsive Design",
          "Transitions & Animations",
          "Pseudo-classes & Pseudo-elements",
          "Tailwind CSS",
        ],

        "Programming Fundamentals (JavaScript)": [
          "Variables & Data Types",
          "Operators & Conditionals",
          "Loops",
          "Functions",
          "Scope & Hoisting",
          "Callbacks, CallbacksHells and Higher Order Functions",
          "Arrays & Objects",
          "String & Array Methods",
          "DOM Manipulation",
          "Events & Event Delegation",
          "This Keyword",
          "Closures",
          "Browser Storage",
          "Fetch API",
        ],

        "ES6 Concepts": [
          "let & const",
          "Arrow Functions",
          "Async/Await, Promises",
          "Template Literals",
          "Destructuring",
          "Spread & Rest Operators",
          "Default Parameters",
          "Object Shorthand Property",
          "Modules",
          "Error Handling (try/catch)",
          "Optional Chaining",
          "Nullish Coalescing",
          "Sets & Maps",
          "Classes",
          "Prototypes & Prototype Chain",
        ],

        "Git & Version Control": [
          "Git Basics",
          "GitHub",
          "Branching",
          "Pull Requests",
          "Merge Conflicts",
          "git rebase",
          "git stash",
          "git cherry-pick",
          "Conventional commits",
          "PR workflow"
        ],

        "Tailwind CSS": [
          "Utility Classes",
          "Responsive Layouts",
          "Component Styling",
        ],
      },

      "PHASE 2 — INTERNET & PROGRAMMING BASICS": {
        "How the Internet Works": [
          "HTTP / HTTPS",
          "DNS",
          "Browser Rendering",
          "Client vs Server",
        ],
      },

      "PHASE 3 — ADVANCED FRONTEND": {
        "React.js": [
          "Components (Functional Components)",
          "JSX",
          "Props",
          "State",
          "useState, useEffect, useRef, useContext",
          "Conditional Rendering",
          "Lists & Keys",
          "Event Handling",
          "Forms Handling (Controlled Components)",
          "Component Lifecycle (Basic understanding)",
        ],
        "Advanced React": [
          "Custom Hooks",
          "Context API (Advanced usage)",
          "Context Performance",
          "React Router (Navigation)",
          "Performance Optimization",
          "Code Splitting",
          "Lazy Loading",
          "Memoization (useMemo, useCallback, React.memo)",
          "Error Boundaries",
          "State Management Basics (Lifting State Up)",
          "Rendering & Re-rendering",
          "Reconciliation",
          "State Batching",
          "Stale Closures",
          "Referential Equality",
          "Suspense",
          "useTransition",
          "Optimistic UI",
          "Redux Toolkit",
          "TanStack Query"
        ],
        "Forms": ["React Hook Form", "Zod Resolver", "Form Validation Patterns"],
        "Next.js": [
          "App Router",
          "Server Components",
          "Client Components",
          "SSR",
          "SSG",
          "ISR",
          "CSR",
          "Streaming",
          "Suspense",
          "Caching",
          "Revalidation",
          "Server Actions",
          "Route Handlers",
          "Middleware/Proxy",
          "Metadata/SEO",
        ],
        "Auth in Next.js (with external backend)": [
          "httpOnly Cookies",
          "Protected Routes via Middleware",
          "Calling external API from Server Components",
          "Token Refresh Flow",
        ],
        "UI Libraries": ["shadcn/ui", "Radix UI", "Component Design"],
      },

      "PHASE 4 — BACKEND DEVELOPMENT": {
        "Node.js": [
          "Event Loop",
          "Modules",
          "File System",
          "Streams",
        ],

        "Express.js": [
          "Routing",
          "Middleware",
          "REST APIs",
          "Error Handling",
        ],

        "All Important Concepts of Node.js for job": [
          "Event Loop & Libuv Architecture",
          "Modules (CommonJS vs ES Modules)",
          "File System (fs & fs/promises) built-in",
          "Streams & Piping built-in",
          "Buffers & Binary Data built-in",
          "EventEmitter Pattern built-in",
          "Cluster Module & Worker Threads built-in",
          "Child Processes (exec, spawn, fork) built-in",
          "Process & Environment Variables (dotenv)"
        ],

        "All Important Concepts of Express for job": [
          "Routing & Dynamic Routes (req.params, req.query)",
          "Middleware (Built-in, Custom, Third-party)",
          "Request & Response Life Cycle",
          "REST API Best Practices & Status Codes",
          "Global & Async Error Handling",
          "Security Best Practices (Helmet, CORS, Rate Limiting)",
          "Static File Serving (express.static)"
        ],


        "API Development & Documentation": [
          "REST API Design",
          "API Security",
          "Rate Limiting",
          "Swagger / OpenAPI",
          "GraphQL Basics",
        ],

        "Authentication & Authorization": [
          "JWT",
          "OAuth",
          "Sessions",
          "Cookies",
        ],

        "Input Validation": [
          "Zod",
          "Schema Validation Practices",
        ],

        "Security Basics": ["OWASP Top 10", "XSS", "CSRF", "SQL/NoSQL Injection", "Password Hashing (bcrypt)"],

        "Additional Backend": [
          "Multer - Media Uploading",
          "Sockets",
          "Payment Integration",
        ],

        Testing: [
          "Unit Testing",
          "Integration Testing",
          "End-to-End Testing",
        ],
        Tools: ["Jest", "Supertest", "Playwright", "React Testing Library"],
      },

      "PHASE 5 — DATABASES": {
        "MongoDB": [
          "Documents",
          "Collections",
          "CRUD Operations",
          "Indexing",
          "Aggregation",
        ],

        "SQL (PostgreSQL)": [
          "Tables",
          "Relationships",
          "Joins",
          "Queries",
          "Indexing",
        ],

        "ORM / ODM": [
          "Prisma",
          "Mongoose",
        ],
      },

      "PHASE 6 — DEVOPS & CLOUD": {
        "DevOps": [
          "Linux Basics",
          "Docker",
          "CI/CD Pipelines",
          "Deployment",
          "Node Production & Cloud Deployment",
          "Basic Aws"
        ],

        "Platforms": [
          "Vercel",
          "AWS",
        ],

        "Logging & Monitoring": [
          "Winston",
          "Pino",
          "Basic Monitoring & Health Checks",
        ],

        "Concepts": [
          "Load Balancing",
          "CDN",
          "Reverse Proxy",
        ],
      },

      "PHASE 7 — JOB READY SKILLS": {
        "Portfolio Projects": [
          "SaaS Application",
          "E-commerce Website",
          "Social Media App",
          "AI Integrated App",
        ],

        Deployment: ["Production Apps", "Domain + Hosting"],

        "Freelancing & Job": [
          "GitHub Portfolio",
          "Resume",
          "LinkedIn",
          "Technical Interviews",
        ],

        "Soft Skills": ["English Communication", "Agile & Jira", "Code Review", "Using AI Tools Properly"],

        "Data Structures & Algorithms": [
          "Arrays",
          "Strings",
          "Linked List",
          "Stack",
          "Queue",
          "Trees",
          "Graphs",
        ],

      },

      "PHASE 8 — OPTIMIZATION": {
        "Node.js Optimization": [
          "Performance Optimization",
          "Memory Management",
          "Efficient Async Operations",
        ],
      },

      "PHASE 9 — SYSTEM DESIGN & TESTING": {
        "System Design Basics": [
          "Scalability (Vertical vs Horizontal)",
          "Database Design & Scaling",
          "Caching Strategies",
          "Message Queues",
          "Microservices Architecture",
        ],

        "Tools": [
          "Kafka",
        ],
      },
    };


    let saved = JSON.parse(localStorage.getItem("roadmapProgress")) || {};

    let container = document.getElementById("roadmap");

    for (let phase in roadmap) {
      let phaseDiv = document.createElement("div");
      phaseDiv.className = "phase";

      let h2 = document.createElement("h2");
      h2.innerText = phase;

      phaseDiv.appendChild(h2);

      for (let topic in roadmap[phase]) {
        let topicDiv = document.createElement("div");
        topicDiv.className = "topic";

        let h3 = document.createElement("h3");
        h3.innerText = topic;

        let ul = document.createElement("ul");

        roadmap[phase][topic].forEach((task) => {
          let li = document.createElement("li");
          li.innerText = task;

          if (saved[task]) {
            li.classList.add("done");
          }

          li.onclick = function () {
            saved[task] = !saved[task];

            localStorage.setItem("roadmapProgress", JSON.stringify(saved));

            li.classList.toggle("done");
          };

          ul.appendChild(li);
        });

        topicDiv.appendChild(h3);
        topicDiv.appendChild(ul);

        phaseDiv.appendChild(topicDiv);
      }

      container.appendChild(phaseDiv);
    }
  </script>
</body>

</html>
